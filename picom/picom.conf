# Backend (glx is usually best for tearing)
backend = "glx";

# VSync - essential for preventing tearing
vsync = true;

# These GLX settings help with tearing
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# Use damage tracking (more efficient)
use-damage = true;

# Helps with some drivers
xrender-sync-fence = true;
